name: Release _davMEDIA

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build, for example v26.10.1'
        required: true
        type: string

jobs:
  publish:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: '--bundles nsis'
          - platform: macos-15
            args: '--bundles dmg'
          - platform: macos-15-intel
            args: '--bundles dmg'
          - platform: ubuntu-22.04
            args: '--bundles appimage,deb'
    runs-on: ${{ matrix.platform }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          set -euo pipefail
          sudo sed -i '\|packages.microsoft.com|d' /etc/apt/sources.list 2>/dev/null || true
          for source_file in /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            [ -f "$source_file" ] || continue
            if sudo grep -q 'packages.microsoft.com' "$source_file"; then
              sudo mv "$source_file" "${source_file}.disabled-davmedia"
            fi
          done
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'

      - name: Verify release versions
        shell: bash
        run: node scripts/verify-release-version.mjs

      - name: Read release description from tagged commit
        id: release_description
        shell: bash
        run: |
          body="$(git log -1 --pretty=%b)"

          if [[ -z "${body//[[:space:]]/}" ]]; then
            echo "The tagged commit has no Description/body." >&2
            exit 1
          fi

          if [[ "$body" != *"🇮🇹"* || "$body" != *"🇺🇸"* ]]; then
            echo "The commit Description must contain both 🇮🇹 and 🇺🇸 sections." >&2
            exit 1
          fi

          delimiter="DAV_RELEASE_BODY_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          {
            echo "body<<$delimiter"
            printf '%s\n' "$body"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm install

      - name: Prepare FFmpeg and FFprobe
        run: npm run prepare:ffmpeg

      - name: Run tests
        run: npm test

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: '_davMEDIA ${{ env.RELEASE_TAG }}'
          releaseBody: ${{ steps.release_description.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
