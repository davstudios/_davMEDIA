[package]
name = "davmedia"
version = "1.0.0"
description = "_davMEDIA desktop application"
authors = ["_davstudios"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "davmedia_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-ico"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
